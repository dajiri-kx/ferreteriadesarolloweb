<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head(title='Pago Fallido - ToolboxCR')}"></head>
    <body class="d-flex flex-column min-vh-100 bg-light">
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container my-5 flex-grow-1">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <!-- Tarjeta de Fallo Premium -->
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white text-center p-5">
                        <!-- Círculo de advertencia -->
                        <div class="mb-4 d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle" style="width: 100px; height: 100px; margin: 0 auto;">
                            <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
                        </div>

                        <h2 class="fw-bold text-dark mb-2">No se pudo procesar el pago</h2>
                        <p class="text-muted mb-4">Lo sentimos, hubo un problema al intentar cobrar a tu tarjeta.</p>

                        <!-- Caja de Detalle del Fallo -->
                        <div class="p-4 bg-danger bg-opacity-5 rounded-4 border border-danger border-opacity-25 text-start mb-4">
                            <div class="d-flex align-items-start">
                                <i class="fa-solid fa-circle-exclamation text-danger fs-4 me-3 mt-1"></i>
                                <div>
                                    <strong class="d-block text-dark mb-1">Motivo del rechazo:</strong>
                                    <span class="text-danger fw-semibold" th:text="${motivo}"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Caja de Detalle de la Orden -->
                        <div class="p-3 bg-light rounded-4 border text-start mb-4 small text-muted">
                            <div class="d-flex justify-content-between mb-1">
                                <span>Número de Pedido:</span>
                                <span class="fw-semibold text-dark" th:text="${pedido.numeroOrden}"></span>
                            </div>
                            <div class="d-flex justify-content-between mb-1">
                                <span>Total a cobrar:</span>
                                <span class="fw-semibold text-dark">₡<span th:text="${#numbers.formatDecimal(pedido.total, 1, 'COMMA', 0, 'POINT')}"></span></span>
                            </div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-flex flex-column gap-3 justify-content-center">
                            <!-- Botón de Reintentar -->
                            <a th:href="@{/carrito/resumen/{id}(id=${pedido.id})}" class="btn btn-danger btn-lg py-3 rounded-3 fw-bold shadow-sm transition-all hover-grow">
                                <i class="fa-solid fa-arrows-rotate me-2"></i>Reintentar Pago
                            </a>

                            <!-- Formulario de Cancelar / Volver al Carrito -->
                            <form th:action="@{/carrito/cancelar-pedido/{id}(id=${pedido.id})}" method="post">
                                <button type="submit" class="btn btn-outline-secondary w-100 py-2 rounded-3 fw-semibold">
                                    <i class="fa-solid fa-arrow-left me-1"></i>Cancelar Pedido y Volver al Carrito
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
