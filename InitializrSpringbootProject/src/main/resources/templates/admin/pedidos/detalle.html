<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

        <main class="container mt-4">
            <div class="row mb-4 align-items-center">
                <div class="col-md-8">
                    <h3 class="mb-0">
                        <i class="fa-solid fa-receipt" style="color: #E8641A;"></i>
                        Pedido <strong th:text="${pedido.numeroOrden}"></strong>
                    </h3>
                </div>
                
                <div class="col-md-4 text-end">
                    <a th:href="@{/admin/pedidos/{id}/factura(id=${pedido.id})}"
                       class="btn btn-outline-primary btn-sm"
                       target="_blank">
                        <i class="fa-solid fa-file-invoice"></i> Factura
                    </a>

                    <a th:href="@{/admin/pedidos}" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left"></i> Volver al listado
                    </a>
                </div>
                
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="card h-100">
                        <div class="card-header card-header-naranja">
                            <i class="fa-solid fa-circle-info"></i> Información del Pedido
                        </div>
                        <div class="card-body">
                            <p class="mb-2">
                                <strong>Cliente:</strong>
                                <span th:text="${pedido.cliente != null ? pedido.cliente.nombre : 'Sin cliente'}"></span>
                            </p>
                            <p class="mb-2">
                                <strong>Fecha:</strong>
                                <span th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span>
                            </p>
                            <p class="mb-0">
                                <strong>Estado actual:</strong>
                                <span class="badge bg-secondary" th:text="${pedido.estado}"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <div class="card h-100">
                        <div class="card-header card-header-naranja">
                            <i class="fa-solid fa-pen-to-square"></i> Actualizar estado
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/pedidos/{id}/estado(id=${pedido.id})}" method="post">
                                <div class="mb-3">
                                    <label for="estado" class="form-label">Nuevo estado</label>
                                    <select id="estado" name="estado" class="form-select" required>
                                        <option th:each="estadoItem : ${estados}"
                                                th:value="${estadoItem}"
                                                th:text="${estadoItem}"
                                                th:selected="${estadoItem == pedido.estado}">
                                        </option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i> Guardar estado
                                </button>
                            </form>

                            <small class="text-muted d-block mt-3">
                                Estados permitidos: pendiente, preparando, enviado y entregado.
                            </small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="card h-100">
                        <div class="card-header card-header-naranja">
                            <i class="fa-solid fa-coins"></i> Resumen
                        </div>
                        <div class="card-body">
                            <p class="mb-1">
                                Subtotal:
                                <span class="float-end"
                                      th:text="${'₡ ' + #numbers.formatDecimal(pedido.subtotal, 1, 'COMMA', 2, 'POINT')}">
                                </span>
                            </p>
                            <p class="mb-1">
                                Envío:
                                <span class="float-end"
                                      th:text="${'₡ ' + #numbers.formatDecimal(pedido.costoEnvio, 1, 'COMMA', 2, 'POINT')}">
                                </span>
                            </p>
                            <p class="mb-1 text-success"
                               th:if="${pedido.descuentoTotal != null and pedido.descuentoTotal.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                                Descuento:
                                <span class="float-end"
                                      th:text="${'-₡ ' + #numbers.formatDecimal(pedido.descuentoTotal, 1, 'COMMA', 2, 'POINT')}">
                                </span>
                            </p>
                            <hr/>
                            <p class="fw-bold fs-5 mb-0">
                                Total:
                                <span class="float-end"
                                      th:text="${'₡ ' + #numbers.formatDecimal(pedido.total, 1, 'COMMA', 2, 'POINT')}">
                                </span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header card-header-naranja">
                    <i class="fa-solid fa-list"></i> Productos del Pedido
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th class="text-center">Cantidad</th>
                                    <th class="text-end">Precio Unit.</th>
                                    <th class="text-end">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${detalles}">
                                    <td th:text="${item.producto.nombre}"></td>
                                    <td class="text-center" th:text="${item.cantidad}"></td>
                                    <td class="text-end"
                                        th:text="${'₡ ' + #numbers.formatDecimal(item.precioUnitario, 1, 'COMMA', 2, 'POINT')}">
                                    </td>
                                    <td class="text-end fw-bold"
                                        th:text="${'₡ ' + #numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
